[DEFAULT]
; Base directory where dbus-serialbattery and its configurations reside.
; Default: /data/apps
SERIALBATTERY_BASE_PATH = /data/apps

; Optional state of charge (SOC) threshold overrides.
; If left empty or commented out, MIN_SOC dynamically uses (ActiveSocLimit + 5%)
; and MAX_SOC defaults to 85.0%.
MIN_SOC = 
MAX_SOC = 85.0

; Switch to the standby BMS when the active BMS raises an alarm (level 2) for 30 s on
; total or cell over/undervoltage, or high/low temperature. 1 = enabled, 0 = disabled.
; Never switches to a BMS that was in alarm when it was left.
ALARM_SWITCH = 1
